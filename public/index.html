<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Consulta de Preço · Serena Puxadores</title>
<meta name="theme-color" content="#0F3A4E">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="48x48" href="/icons/favicon-48.png">
<link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Preços Serena">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#F5F2ED; --surface:#FFFFFF; --ink:#143F54; --ink2:#3C4E58; --muted:#5B6970; --line:#E4DED3; --line2:#F0EBE3;
  --petrol:#164C64; --petrol-d:#0F3A4E; --charcoal:#373435;
  --accent:#8A6526; --accent-soft:#FBF0DF; --gold:#FFD195;
  --ok:#16658A; --ok-soft:#E3EEF3; --warn:#A84B08; --warn-soft:#FBEEE3; --off:#6B7378; --off-soft:#EEEBE6;
  --display:"Montserrat",system-ui,sans-serif; --body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:light; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
body{margin:0;font:15px/1.45 var(--body);background:var(--bg);color:var(--ink);-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
.mono{font-family:var(--mono)}
.muted{color:var(--muted);font-size:13px}
:focus-visible{outline:2px solid var(--ok);outline-offset:2px}

/* ---------- login ---------- */
.lg{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;background:var(--petrol-d)}
.lg-card{width:100%;max-width:380px;background:var(--surface);border-radius:20px;padding:28px 24px;border-top:4px solid var(--gold);display:flex;flex-direction:column;gap:14px}
.lg-brand{display:block;width:210px;max-width:70%;height:auto;margin:0 auto 6px}
.lg-sub{text-align:center;font-family:var(--display);font-size:11px;font-weight:700;letter-spacing:.28em;text-transform:uppercase;color:var(--accent);margin-top:-4px}
.lg-card h1{margin:0;font-family:var(--display);font-size:22px;font-weight:700;letter-spacing:-.01em;text-align:center}
.fld{display:flex;flex-direction:column;gap:6px}
.fld label{font-size:13px;font-weight:600;color:var(--ink2)}
.inp{height:46px;border:1px solid #D6D3CC;border-radius:12px;padding:0 14px;background:var(--surface);width:100%;font-size:16px}
.btn{height:46px;padding:0 18px;border-radius:12px;font-weight:700;font-size:15px;border:1px solid #D6D3CC;background:var(--surface);white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn-dark{background:var(--petrol);color:#fff;border-color:var(--petrol)}
.btn-dark:hover{background:var(--petrol-d)}
.btn-sm{height:38px;padding:0 12px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.55;cursor:default}
.err{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:10px 12px;font-weight:600;font-size:14px}
.hint{margin:0;font-size:13px;color:var(--muted);line-height:1.5}

/* ---------- vendedor ---------- */
.vd{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.vd-dark{background:#0F3A4E;color:#F7F4EF}
.vtop{height:60px;padding:0 16px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-shrink:0}
.vtop b{font-family:var(--display);font-size:18px;letter-spacing:-.01em;display:block}
.vtop small{font-size:12px;color:#B7CAD4}
.chip{font-size:12px;font-weight:700;padding:6px 10px;border-radius:999px;white-space:nowrap}
.scan-btn{position:relative;width:100%;aspect-ratio:6/5;max-height:340px;border-radius:22px;border:0;background:#134761;color:#F7F4EF;overflow:hidden;display:block;padding:0;cursor:pointer}
.scan-btn video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none}
.scan-btn.on video{display:block}
.scan-btn.on::after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,0) 55%,rgba(0,0,0,.55));pointer-events:none}
.scan-btn.on .scan-frame{z-index:1;left:10%;right:10%;top:28%;bottom:30%}
.scan-btn.on .scan-txt{z-index:2}
.scan-btn.ok .scan-frame i{border-color:#7CD39A}
.scan-tools{position:absolute;z-index:3;top:10px;right:10px;display:flex;gap:8px}
.scan-tools button{height:34px;border-radius:17px;border:0;background:rgba(0,0,0,.45);color:#F7F4EF;font:inherit;font-size:13px;font-weight:600;padding:0 12px}
.scan-frame{position:absolute;left:16%;right:16%;top:22%;bottom:30%}
.scan-frame i{position:absolute;width:30px;height:30px;border:3px solid #F7F4EF}
.scan-frame i:nth-child(1){left:0;top:0;border-right:0;border-bottom:0;border-radius:7px 0 0 0}
.scan-frame i:nth-child(2){right:0;top:0;border-left:0;border-bottom:0;border-radius:0 7px 0 0}
.scan-frame i:nth-child(3){left:0;bottom:0;border-right:0;border-top:0;border-radius:0 0 0 7px}
.scan-frame i:nth-child(4){right:0;bottom:0;border-left:0;border-top:0;border-radius:0 0 7px 0}
.scan-line{position:absolute;left:8%;right:8%;top:50%;height:2px;background:var(--gold);animation:sl 2.2s ease-in-out infinite}
@keyframes sl{0%,100%{transform:translateY(-34px)}50%{transform:translateY(34px)}}
@media (prefers-reduced-motion:reduce){.scan-line{animation:none}}
.scan-txt{position:absolute;left:0;right:0;bottom:7%;text-align:center;font-size:15px;font-weight:600;color:#E3ECF0;padding:0 16px}
.scan-sub{display:block;font-size:12px;font-weight:500;color:#B7CAD4;margin-top:3px}
.dk-inp{background:#164C64;border-color:#3C6E86;color:#F7F4EF;font-family:var(--mono);letter-spacing:.04em}
.dk-inp::placeholder{color:#93A9B5}
.bsug{display:flex;flex-direction:column;background:#F7F4EF;border-radius:14px;overflow:hidden;box-shadow:0 10px 28px rgba(0,0,0,.28);margin-top:4px}
.bsug:empty{display:none}
.bsug button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;border-bottom:1px solid #E6E1D8;background:transparent;padding:8px 12px;min-height:56px;color:#0F3A4E;font:inherit}
.bsug button:last-child{border-bottom:0}
.bsug button:active,.bsug button[aria-selected="true"]{background:#EDE6D9}
.bsug img,.bsug .ph{flex:0 0 40px;width:40px;height:40px;border-radius:8px;background:#fff;object-fit:contain;border:1px solid #E6E1D8}
.bsug .m{display:flex;flex-direction:column;gap:2px;flex:1 1 0;min-width:0}
.bsug .sn{font-size:14px;font-weight:600;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bsug .sn.corta{-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 28px),rgba(0,0,0,.25));mask-image:linear-gradient(90deg,#000 calc(100% - 28px),rgba(0,0,0,.25))}
.bsug .s{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bsug .s{font-size:12px;color:#5B6B73}
.bsug .p{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-end;gap:2px;font-size:14px;font-weight:700;white-space:nowrap;padding-left:6px}
.bsug .p .e{font-size:12px;font-weight:500;color:#5B6B73}
.bsug .vazio{padding:14px 12px;font-size:14px;color:#5B6B73}
.rec-img{flex:0 0 44px;width:44px;height:44px;border-radius:10px;background:#fff;object-fit:contain;display:block}
.rec{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#164C64;border:0;border-radius:14px;padding:10px 12px;min-height:58px;color:#F7F4EF}
.sw{width:22px;height:22px;border-radius:999px;flex-shrink:0;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.nf{background:#2B2118;border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.nf b{color:#F5C79B;font-size:14px}.nf span{color:#E4D9CC;font-size:13px;line-height:1.45}
.ptop{position:sticky;top:0;z-index:5;height:56px;padding:0 8px 0 4px;display:flex;align-items:center;gap:4px;background:var(--bg);border-bottom:1px solid var(--line)}
.icon-btn{width:44px;height:44px;border:0;background:transparent;border-radius:12px;display:flex;align-items:center;justify-content:center}
.pbody{flex:1;padding:16px 16px 24px;display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);border-radius:20px;overflow:hidden}
.car{position:relative;aspect-ratio:6/5;background:#E9E7E2;overflow:hidden;touch-action:pan-y;user-select:none}
.car-track{display:flex;height:100%;transition:transform .32s ease}
.car-track>div{flex:0 0 100%;height:100%}
.car-track svg,.car-track img{width:100%;height:100%;display:block}
.car-track img{object-fit:contain;background:#fff}
.thumb img{width:100%;height:100%;object-fit:cover;display:block;background:#fff}
.car-count{position:absolute;right:12px;top:12px;font:500 12px var(--mono);color:#F7F4EF;background:rgba(23,23,26,.72);padding:4px 9px;border-radius:999px}
.car-nav{position:absolute;top:50%;margin-top:-22px;width:44px;height:44px;border-radius:999px;border:0;background:rgba(255,255,255,.88);display:flex;align-items:center;justify-content:center}
.car-dots{position:absolute;left:0;right:0;bottom:2px;display:flex;justify-content:center}
.car-dots button{width:28px;height:34px;border:0;background:transparent;display:flex;align-items:center;justify-content:center;padding:0}
.car-dots span{display:block;height:8px;width:8px;border-radius:999px;background:rgba(23,23,26,.3);transition:width .2s}
.car-dots button[aria-current="true"] span{width:20px;background:var(--ink)}
.noimg.escolha{flex-direction:column;gap:8px;text-align:center;padding:24px;color:var(--ink2);font-size:14px;background:repeating-linear-gradient(135deg,#F7F4EF 0 14px,#F1ECE3 14px 28px)}
.noimg.escolha b{font-family:var(--display);font-size:18px;color:var(--ink)}
.escolha-txt{font-size:15px;font-weight:600;color:var(--accent)}
.noimg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:14px;font-weight:600}
.ps{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:14px 16px;border-bottom:1px solid #ECEAE5}
.ps .lbl{font-size:12px;color:var(--muted);font-weight:600}
.big{font-family:var(--display);font-weight:700;font-size:30px;letter-spacing:-.02em;line-height:1.15}
.strike{font-size:13px;color:var(--muted);text-decoration:line-through}
.info{padding:14px 16px 18px;display:flex;flex-direction:column;gap:6px}
.eyebrow{font-family:var(--display);font-size:11px;font-weight:700;color:var(--accent);letter-spacing:.2em;text-transform:uppercase}
.info h1{margin:0;font-family:var(--display);font-weight:700;font-size:24px;line-height:1.15;letter-spacing:-.015em}
.codes{display:flex;gap:14px;flex-wrap:wrap;font:12px var(--mono);color:var(--muted)}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pill{height:38px;padding:0 14px;border-radius:999px;font-size:13px;font-weight:600;background:var(--surface);color:var(--ink2);border:1px solid #D6D3CC}
.pill[aria-pressed="true"]{background:var(--ink);color:#F7F4EF;border-color:var(--ink)}
.vh button{border:0;background:none;padding:0;font:inherit;color:inherit;letter-spacing:inherit;text-transform:inherit;display:flex;align-items:center;gap:3px;min-height:36px;width:100%}
.vh button .sa{width:10px}
.vh button.dir{position:relative;justify-self:end;width:auto}
.vh button.dir .sa{position:absolute;left:100%;margin-left:1px;width:auto}
.vh{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,.8fr) minmax(0,1.05fr) minmax(0,.75fr);gap:8px;padding:2px 16px;font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.05em;text-transform:uppercase;border-bottom:1px solid #ECEAE5}
.vr{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,.8fr) minmax(0,1.05fr) minmax(0,.75fr);gap:8px;align-items:center;width:100%;min-height:54px;padding:0 16px;border:0;border-bottom:1px solid #F0EEEA;background:var(--surface);text-align:left;font-size:14px}
.vr[aria-current="true"]{background:var(--accent-soft)}
.vr .c{display:flex;align-items:center;gap:8px;min-width:0;font-weight:600}
.vr .c span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vr .p{text-align:right;font-weight:700}
.vr .e{display:flex;align-items:center;justify-content:flex-end;gap:6px;font-weight:600}
.dot{width:8px;height:8px;border-radius:999px;flex-shrink:0;display:inline-block}
.pbot{position:sticky;bottom:0;padding:12px 16px calc(16px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line)}
.pbot .btn{width:100%;height:52px;font-size:16px;border-radius:14px}
.loading{padding:40px 16px;text-align:center;color:var(--muted)}

/* ---------- pré-pedido ---------- */
.vd-wide{max-width:1000px}
.strip{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;border-radius:14px;padding:10px 12px;min-height:56px;background:var(--accent-soft);color:var(--ink)}
.strip b{font-size:14px;display:block}.strip small{font-size:12px;color:var(--ink2)}
.vd-dark .strip{background:#1C5670;color:#F7F4EF}.vd-dark .strip small{color:#F3DDB8}
.step{display:flex;align-items:center;border:1px solid #D6D3CC;border-radius:12px;background:var(--surface);height:46px;flex-shrink:0}
.step button{width:42px;height:44px;border:0;background:transparent;font-size:20px;font-weight:600}
.step input{width:44px;height:44px;border:0;text-align:center;font-weight:700;font-size:16px;background:transparent;-moz-appearance:textfield}
.step input::-webkit-outer-spin-button,.step input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.step.sm{height:38px;border-radius:10px}.step.sm button{width:34px;height:36px;font-size:18px}.step.sm input{width:38px;height:36px;font-size:14px}
.pcard{display:flex;flex-direction:column;gap:6px;width:100%;text-align:left;background:var(--surface);border:0;border-radius:16px;padding:14px 16px}
.pcard .l1{display:flex;justify-content:space-between;gap:10px;align-items:center}
@media (pointer:coarse){input,select,textarea{font-size:16px!important}}
.busca{display:flex;gap:8px;align-items:stretch}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px}
.chips::-webkit-scrollbar{display:none}
.chips .pill{flex-shrink:0;height:38px;font-size:14px}
.cal{display:flex;flex-direction:column;gap:10px}
.cal-h{display:flex;align-items:center;justify-content:space-between}
.cal-h b{font-family:var(--display);font-size:17px}
.cal-g{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px;text-align:center}
.cal-g .wd{font-size:12px;font-weight:700;color:var(--muted);padding:4px 0}
.cal-g button{height:42px;border:0;background:transparent;border-radius:10px;font-size:15px;font-weight:600;color:var(--ink)}
.cal-g button.out{visibility:hidden}
.cal-g button.hj{box-shadow:inset 0 0 0 1px #C9C6BE}
.cal-g button.mid{background:var(--accent-soft);border-radius:0}
.cal-g button.sel{background:var(--ink);color:#F7F4EF}
.cal-res{font-size:14px;font-weight:600;min-height:20px}
.busca .inp{height:44px;font-size:15px}
.busca input[type=date]{flex:0 0 150px;min-width:0;padding:0 10px}
.pag{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:2px}
.pag .btn{height:40px;font-size:14px;border-radius:10px}
.vazio{background:var(--surface);border-radius:16px;padding:16px;color:var(--muted);font-size:14px}
mark{background:#F3E3BF;color:inherit;border-radius:3px;padding:0 1px}
.sec{font-family:var(--display);font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin:6px 0 -4px}
.it{display:grid;grid-template-columns:1fr auto auto;grid-template-areas:"p p p" "u q s";gap:10px 12px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line2)}
.it-p{grid-area:p;display:flex;gap:10px;min-width:0}.it-u{grid-area:u;font-size:13px;color:var(--ink2)}.it-q{grid-area:q}.it-s{grid-area:s;font-weight:700;text-align:right;min-width:92px}
.it-h{display:none}
@media (min-width:760px){
  .it,.it-h{grid-template-columns:minmax(0,2.4fr) 110px 130px 110px;grid-template-areas:"p u q s"}
  .it-h{display:grid;gap:12px;padding:10px 16px;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line)}
  .it-u{text-align:right}
}
.amb-row{display:flex;gap:6px;align-items:center;overflow-x:auto;scrollbar-width:none;padding:2px 0}
.amb-row::-webkit-scrollbar{display:none}
.amb-row .pill{height:36px;flex-shrink:0;padding:0 12px}
.amb-l{font-size:12px;font-weight:700;color:var(--muted);flex-shrink:0;margin-right:2px}
.amb-gaveta{display:grid;grid-template-rows:0fr;transition:grid-template-rows .28s ease,opacity .2s ease;opacity:0;margin-bottom:-8px}
.amb-gaveta>div{overflow:hidden;min-height:0}
.pbot.amb-on .amb-gaveta{grid-template-rows:1fr;opacity:1;margin-bottom:0}
.amb-gaveta[aria-hidden="true"] .pill{visibility:hidden}
.pbot.amb-on .amb-gaveta .pill{visibility:visible}
.amb-aba{position:absolute;left:50%;top:0;transform:translate(-50%,-100%);display:inline-flex;align-items:center;gap:6px;max-width:88%;height:30px;padding:0 14px;border:1px solid var(--line);border-bottom:0;border-radius:14px 14px 0 0;background:var(--bg);color:var(--ink);font:inherit;font-size:12px;font-weight:700;box-shadow:0 -4px 10px rgba(15,58,78,.06)}
.amb-aba .txt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.amb-aba .seta{font-size:9px;transition:transform .28s ease}
.pbot.amb-on .amb-aba .seta{transform:rotate(180deg)}
@media (prefers-reduced-motion:reduce){.amb-gaveta,.amb-aba .seta{transition:none}}
.sug{display:flex;flex-wrap:wrap;gap:6px}
.grp{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 12px 10px 16px;border-bottom:1px solid var(--line)}
.grp-t{display:flex;align-items:center;gap:2px;min-width:0}
.grp-t b{font-family:var(--display);font-size:18px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pen{width:40px;height:40px;border:0;background:transparent;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;color:var(--muted);flex-shrink:0}
.pen:hover{background:var(--bg);color:var(--ink)}
.grp .muted{white-space:nowrap}
.mv{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin-top:4px}
.mv select{height:30px;border:1px solid #D6D3CC;border-radius:8px;background:var(--surface);font-size:13px;padding:0 6px;max-width:170px}
.tot .big{white-space:nowrap}
.thumb{width:52px;height:52px;border-radius:10px;overflow:hidden;background:#E9E7E2;flex-shrink:0;display:block}
.thumb svg{width:100%;height:100%;display:block}
.it[data-drag]{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.grip{color:#B5B2AA;display:flex;align-items:flex-start;padding-top:3px;margin-left:-8px;margin-right:-4px;cursor:grab;flex-shrink:0}
body.dragging .card[data-drop]{box-shadow:inset 0 0 0 2px #D6D3CC}
body.dragging .card.drop-on{box-shadow:inset 0 0 0 2px var(--ink);background:#FBF8F2}
.drag-only{display:none!important}
body.dragging .drag-only{display:block!important}
.it.lifting{opacity:.3}
.swx{position:relative;overflow:hidden}
.swx-bg{position:absolute;inset:0;background:#B4410A;color:#fff;display:flex;align-items:center;justify-content:flex-end;gap:8px;padding-right:22px;font-weight:700;font-size:14px;opacity:0}
.swx .it{position:relative;background:var(--surface)}
.it[data-k]{touch-action:pan-y}
.it.snap{transition:transform .22s ease}
#toast .undo{margin-left:14px;border:0;background:none;color:var(--gold);font-weight:800;font-size:14px;padding:4px 2px;cursor:pointer}
.ghost{position:fixed;z-index:70;pointer-events:none;border-radius:14px;box-shadow:0 14px 34px rgba(0,0,0,.24);transform:rotate(-1.2deg);opacity:.96}
.ghost .it{border-bottom:0}
body.dragging{cursor:grabbing}
.mvall{display:flex;flex-direction:column;gap:8px;padding-top:14px;border-top:1px solid var(--line2)}
.mvall .lbl{font-size:13px;font-weight:600;color:var(--ink2)}
.tot{flex-wrap:wrap;display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:16px}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.acts .btn{flex:1 1 200px}

/* ---------- admin ---------- */
.painel{display:flex;min-height:100vh}
.painel nav{flex:0 0 260px;width:260px;position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--petrol-d);color:#F7F4EF;padding:24px 16px;display:flex;flex-direction:column;gap:22px}
.painel nav .brand b{font-family:var(--display);font-size:20px;display:block}
.painel nav .brand small{font-size:12px;color:#B7CAD4}
.navb{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;min-height:44px;padding:0 12px;border-radius:10px;border:0;background:transparent;color:#E3ECF0;text-align:left;font-size:14px;font-weight:600}
.navb[aria-current="page"]{background:#F7F4EF;color:var(--petrol-d);box-shadow:inset 3px 0 0 var(--gold)}
.badge{font-size:12px;font-weight:700;background:var(--gold);color:var(--ink);border-radius:999px;padding:2px 8px}
.navfoot{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.navstat{padding:12px;border-radius:12px;background:#164C64;display:flex;flex-direction:column;gap:4px;font-size:12px;color:#B7CAD4}
.navstat b{color:#F7F4EF;font-size:13px;display:flex;align-items:center;gap:8px}
.navlink{border:1px solid #3C6E86;background:transparent;color:#F7F4EF;border-radius:10px;min-height:42px;font-size:13px;font-weight:700}
.painel main{flex:1 1 0;min-width:0;padding:32px clamp(20px,2.5vw,48px) 48px;display:flex;flex-direction:column;gap:22px;width:100%}
@media (max-width:760px){.painel{flex-direction:column}.painel nav{flex:none;width:auto;height:auto;position:static}}
@media (max-width:640px){.painel main{padding:20px 14px 40px}}
.hdr{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between}
.hdr h1{margin:0;font-family:var(--display);font-weight:700;font-size:30px;letter-spacing:-.02em}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.stat{background:var(--surface);border-radius:16px;padding:16px 18px;display:flex;flex-direction:column;gap:4px}
.stat b{font-family:var(--display);font-size:24px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(420px,100%),1fr));gap:16px;align-items:start}
@media (max-width:420px){.grid2{grid-template-columns:1fr}}
.box{background:var(--surface);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:16px;min-width:0}
.box h2{margin:0;font-family:var(--display);font-weight:600;font-size:17px}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.painel .inp{height:42px;font-size:14px;border-radius:10px}
.painel .btn{height:42px;font-size:14px;border-radius:10px}
.sw-row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:10px 0;border-top:1px solid var(--line2)}
.switch{width:46px;height:28px;border-radius:999px;border:0;padding:3px;display:flex;background:#CFCCC5;flex-shrink:0}
.switch span{width:22px;height:22px;border-radius:999px;background:#fff;display:block}
.switch[aria-checked="true"]{background:var(--ink);justify-content:flex-end}
.ck{display:flex;align-items:center;gap:10px;min-height:34px;font-size:14px;cursor:pointer}
.ck input{width:18px;height:18px;accent-color:var(--ink)}
.tbox{background:var(--surface);border-radius:16px;overflow-x:auto}
.t{width:100%;border-collapse:collapse;font-size:14px;min-width:760px}
.t th.r,.t td.r{text-align:right}
.t th{text-align:left;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.t td{padding:10px 12px;border-bottom:1px solid var(--line2);vertical-align:middle}
.t tr.sel td{background:#F7F2E8}
.r{text-align:right}
.t td.mono,.t td.nw{white-space:nowrap}
.tag{font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;white-space:nowrap;display:inline-block}
.tag-ok{color:var(--ok);background:var(--ok-soft)}.tag-warn{color:var(--warn);background:var(--warn-soft)}.tag-acc{color:var(--accent);background:var(--accent-soft)}.tag-off{color:#4E4E55;background:var(--off-soft)}
.apag{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:4px 4px 0}
.apag-b{display:flex;gap:8px;align-items:center}
.apag .btn:disabled{opacity:.45}
.toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
.rank{display:flex;flex-direction:column;gap:6px}
.rank .bar{height:8px;background:var(--line2);border-radius:999px}
.rank .bar i{display:block;height:8px;border-radius:999px;background:var(--accent)}
.av{width:32px;height:32px;border-radius:999px;background:#EDE6D6;color:#5A4214;font-weight:700;font-size:13px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}

/* ---------- modal / toast ---------- */
.ov{position:fixed;inset:0;z-index:60;background:rgba(23,23,26,.45);display:flex;align-items:center;justify-content:center;padding:16px}
.dlg{background:var(--surface);border-radius:18px;width:100%;max-width:520px;max-height:90vh;overflow:auto;padding:22px;display:flex;flex-direction:column;gap:14px}
.dlg.wide{max-width:900px}
.dlg h2{margin:0;font-family:var(--display);font-size:20px}
.dlg-act{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.dlg-act:not(:has(> :nth-child(3))){flex-wrap:nowrap}
.dlg-act:not(:has(> :nth-child(3))) > .btn{flex:0 0 auto}
.dlg-act:not(:has(> :nth-child(3))) > .btn-dark{flex:1 1 auto;min-width:0}
.labels{display:flex;flex-wrap:wrap;gap:8px}
.lab{width:30mm;height:10mm;box-sizing:border-box;border:1px dashed #C9C6BE;border-radius:3px;padding:0;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden}
.lab svg{width:100%;height:100%;display:block}
@media (max-width:640px){#toast{bottom:auto!important;top:72px}}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:80;background:var(--petrol-d);color:#F7F4EF;padding:12px 18px;border-radius:12px;font-weight:600;font-size:14px;max-width:calc(100% - 32px);box-shadow:0 8px 24px rgba(0,0,0,.25)}

/* ---------- EAN-13 em SVG (etiquetas dos mostruários) ---------- */
const EL = ["0001101","0011001","0010011","0111101","0100011","0110001","0101111","0111011","0110111","0001011"];
const EG = ["0100111","0110011","0011011","0100001","0011101","0111001","0000101","0010001","0001001","0010111"];
const ER = ["1110010","1100110","1101100","1000010","1011100","1001110","1010000","1000100","1001000","1110100"];
const EP = ["LLLLLL","LLGLGG","LLGGLG","LLGGGL","LGLLGG","LGGLLG","LGGGLL","LGLGLG","LGLGGL","LGGLGL"];
function barcode(ean){
  const d = ean.split("").map(Number), par = EP[d[0]];
  let bits = "101";
  for(let i=1;i<=6;i++) bits += (par[i-1] === "L" ? EL : EG)[d[i]];
  bits += "01010";
  for(let i=7;i<=12;i++) bits += ER[d[i]];
  bits += "101";
  // mesma geometria do PDF: 1 unidade = 0,25 mm, etiqueta de 120 × 40 (30 × 10 mm)
  const q = 12.5, top = 2.8;
  let rects = "";
  for(let i=0;i<bits.length;i++) if(bits[i] === "1"){ const guard = i < 3 || (i >= 45 && i < 50) || i >= 92; rects += `<rect x="${q+i}" y="${top}" width="1" height="${guard ? 29.2 : 26}"/>`; }
  const t = (x, s, len, a) => `<text x="${x}" y="${top + 33}" font-family="Courier New,monospace" font-weight="700" font-size="7.6"${a ? ` text-anchor="${a}"` : ""}${len ? ` textLength="${len}" lengthAdjust="spacing"` : ""}>${s}</text>`;
  return `<svg viewBox="0 0 120 40" role="img" aria-label="Código de barras ${ean}"><g fill="#000">${rects}</g>${t(q - 1.6, d[0], 0, "end")}${t(q + 4, ean.slice(1,7), 39)}${t(q + 51, ean.slice(7), 39)}</svg>`;
}

/* ---------- câmera ao vivo dentro da tela do leitor: lê sozinha, sem abrir outra janela ---------- */
const CAM = { stream:null, det:null, timer:0, ultimo:"", vezes:0, luz:false, erro:"", fora:0, bloq:"", bloqAte:0, ligando:false };
const eanValido = c => { if(!/^(\d{8}|\d{12}|\d{13})$/.test(c)) return false; const d = c.split("").map(Number), chk = d.pop(); const s = d.reverse().reduce((a, n, i) => a + n * (i % 2 ? 1 : 3), 0); return (10 - s % 10) % 10 === chk; };
function carregaScript(src){ return new Promise((ok, err) => { const s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = () => err(new Error("Não foi possível carregar o leitor.")); document.head.appendChild(s); }); }
async function detector(){
  if(CAM.det) return CAM.det;
  const formats = ["ean_13","ean_8","upc_a"];
  try{ if("BarcodeDetector" in window && (await BarcodeDetector.getSupportedFormats()).includes("ean_13")) return CAM.det = new BarcodeDetector({ formats }); }catch(e){}
  // iPhone e navegadores sem leitor nativo: leitor ZXing em WebAssembly
  if(!window.BarcodeDetectionAPI) await carregaScript("https://cdn.jsdelivr.net/npm/barcode-detector@3.2.3/dist/iife/ponyfill.js");
  return CAM.det = new window.BarcodeDetectionAPI.BarcodeDetector({ formats });
}
function desligarCamera(){
  clearTimeout(CAM.timer); CAM.timer = 0;
  if(CAM.stream){ CAM.stream.getTracks().forEach(t => t.stop()); CAM.stream = null; }
  CAM.luz = false;
  const box = document.getElementById("scanBox"); if(box) box.classList.remove("on");
}
async function ligarCamera(){
  if(CAM.stream || CAM.ligando || document.hidden) return;
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ CAM.erro = "Câmera indisponível neste navegador. Use 📷 Foto"; return cameraNaTela(); }
  CAM.ligando = true;
  const t = document.getElementById("scanTxt"); if(t) t.firstChild.textContent = "Ligando a câmera…";
  try{
    const [stream] = await Promise.all([
      navigator.mediaDevices.getUserMedia({ audio:false, video:{ facingMode:{ ideal:"environment" }, width:{ ideal:1280 }, height:{ ideal:720 } } }),
      detector()
    ]);
    CAM.stream = stream; CAM.erro = "";
    if(!document.getElementById("scanBox") || document.hidden){ CAM.ligando = false; return desligarCamera(); }
    const tr = stream.getVideoTracks()[0], cap = tr.getCapabilities ? tr.getCapabilities() : {};
    CAM.temLuz = !!cap.torch;
    if(cap.focusMode && cap.focusMode.includes("continuous")) tr.applyConstraints({ advanced:[{ focusMode:"continuous" }] }).catch(() => {});
  }catch(x){
    const negado = x && (x.name === "NotAllowedError" || x.name === "SecurityError");
    CAM.erro = negado ? "Câmera bloqueada. Libere nas configurações do navegador ou toque em 📷 Foto" : "Não foi possível ligar a câmera. Toque para tentar de novo";
  }
  CAM.ligando = false;
  cameraNaTela();
}
async function luzCamera(){
  if(!CAM.stream) return; CAM.luz = !CAM.luz;
  try{ await CAM.stream.getVideoTracks()[0].applyConstraints({ advanced:[{ torch:CAM.luz }] }); }catch(x){}
}
// liga o vídeo ao elemento da tela atual (a tela é redesenhada a cada leitura) e mantém a leitura rodando
function cameraNaTela(){
  const box = document.getElementById("scanBox"), v = document.getElementById("scanVideo");
  if(!box || !v) return;
  const t = document.getElementById("scanTxt");
  if(!CAM.stream){
    box.classList.remove("on");
    if(t) t.firstChild.textContent = CAM.erro || "Toque para ligar a câmera";
    if(!CAM.erro) ligarCamera();
    return;
  }
  box.classList.add("on");
  if(t) t.firstChild.textContent = "Aponte para o código de barras";
  const luz = document.getElementById("camLuz"); if(luz) luz.hidden = !CAM.temLuz;
  if(v.srcObject !== CAM.stream){ v.srcObject = CAM.stream; v.play().catch(() => {}); }
  if(!CAM.timer) passoCamera();
}
const cvCam = document.createElement("canvas"), cxCam = cvCam.getContext("2d", { willReadFrequently:true });
async function passoCamera(){
  CAM.timer = 0;
  if(!CAM.stream) return;
  const v = document.getElementById("scanVideo");
  // saiu da tela de leitura (produto, pré-pedido, admin) ou do app: desliga na hora; liga de novo ao voltar
  if(!v || document.hidden) return desligarCamera();
  try{
    if(v.srcObject !== CAM.stream){ v.srcObject = CAM.stream; v.play().catch(() => {}); }
    const W = v.videoWidth, H = v.videoHeight;
    if(W && H && !V.busy){
      const w = Math.round(W * .85), h = Math.round(Math.min(H * .5, w * .6));
      cvCam.width = w; cvCam.height = h; cxCam.drawImage(v, (W - w) / 2, (H - h) / 2, w, h, 0, 0, w, h);
      const r = (await CAM.det.detect(cvCam)).map(x => String(x.rawValue).replace(/\D/g, "")).find(eanValido);
      if(r && !(r === CAM.bloq && Date.now() < CAM.bloqAte)){
        CAM.vezes = r === CAM.ultimo ? CAM.vezes + 1 : 1; CAM.ultimo = r;
        if(CAM.vezes >= 2){
          CAM.vezes = 0; CAM.ultimo = ""; CAM.bloq = r; CAM.bloqAte = Date.now() + 4000;
          const box = document.getElementById("scanBox"); if(box) box.classList.add("ok");
          if(navigator.vibrate) navigator.vibrate(60);
          buscar(r);
        }
      }
    }
  }catch(x){}
  if(CAM.stream && !CAM.timer) CAM.timer = setTimeout(passoCamera, 90);
}
document.addEventListener("visibilitychange", () => { if(document.hidden) desligarCamera(); else if(document.getElementById("scanBox")) { CAM.erro = ""; ligarCamera(); } });

/* ---------- bipe de leitura ---------- */
let audioCtx = null;
function liberaAudio(){
  try{ audioCtx ||= new (window.AudioContext || window.webkitAudioContext)(); if(audioCtx.state === "suspended") audioCtx.resume(); }catch(e){}
}
["pointerdown","keydown","touchstart"].forEach(ev => document.addEventListener(ev, liberaAudio, { capture:true, passive:true }));
function bipe(ok){
  try{
    liberaAudio(); if(!audioCtx) return;
    const t0 = audioCtx.currentTime;
    const tom = (freq, ini, dur) => {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = "square"; o.frequency.value = freq;
      g.gain.setValueAtTime(0.0001, t0 + ini);
      g.gain.exponentialRampToValueAtTime(0.18, t0 + ini + 0.01);
      g.gain.setValueAtTime(0.18, t0 + ini + dur - 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + ini + dur);
      o.connect(g).connect(audioCtx.destination); o.start(t0 + ini); o.stop(t0 + ini + dur + 0.02);
    };
    if(ok) tom(2400, 0, 0.12);
    else { tom(420, 0, 0.14); tom(320, 0.18, 0.2); }
  }catch(e){}
}

const APG = 10;
function pagina(list, key, size = APG){
  A.pg ||= {};
  const n = Math.max(1, Math.ceil(list.length / size)), pg = Math.min(Math.max(1, A.pg[key] || 1), n); A.pg[key] = pg;
  const items = list.slice((pg - 1) * size, pg * size);
  const html = list.length > size ? `<div class="apag"><span class="muted">${(pg - 1) * size + 1}–${Math.min(pg * size, list.length)} de ${list.length}</span>
    <div class="apag-b"><button class="btn btn-sm" data-act="apg" data-k="${key}" data-d="-1" ${pg <= 1 ? "disabled" : ""}>‹ Anterior</button><span class="muted">Página ${pg} de ${n}</span><button class="btn btn-sm" data-act="apg" data-k="${key}" data-d="1" ${pg >= n ? "disabled" : ""}>Próxima ›</button></div></div>` : "";
  return { items, html };
}

}

const ETQ = () => ({ dpi:203, red:1, fmt:"termica", ...store.get("cp-etq", {}) });
// folha A4: margem de segurança de 10 mm (as impressoras não imprimem na borda) e 2 mm entre etiquetas para recortar
const A4 = (() => { const W = 210, H = 297, mg = 10, gx = 2, gy = 2, w = 30, h = 10;
  const cols = Math.floor((W - 2 * mg + gx) / (w + gx)), rows = Math.floor((H - 2 * mg + gy) / (h + gy));
  return { W, H, w, h, gx, gy, cols, rows, x0:(W - (cols * w + (cols - 1) * gx)) / 2, y0:(H - (rows * h + (rows - 1) * gy)) / 2 }; })();
// desenha uma etiqueta de 30 × 10 mm com tudo alinhado aos pontos da impressora:
// módulo ≈ 0,25 mm em pontos inteiros (2 em 203 dpi, 3 em 300, 6 em 600); cada barra perde "red" pontos à direita para compensar o borrão
function desenhaEtiqueta(doc, ean, cfg, ox = 0, oy = 0){
  const W = 30, dot = 25.4 / cfg.dpi, m = Math.max(2, Math.round(0.25 / dot)), red = Math.min(cfg.red, m - 1);
  const x0 = Math.round((W / dot - 95 * m) / 2), top = Math.round(0.7 / dot), h = Math.round(6.5 / dot), hg = Math.round(7.3 / dot);
  const d = ean.split("").map(Number), par = EP[d[0]];
  let bits = "101";
  for(let i = 1; i <= 6; i++) bits += (par[i-1] === "L" ? EL : EG)[d[i]];
  bits += "01010"; for(let i = 7; i <= 12; i++) bits += ER[d[i]]; bits += "101";
  doc.setFillColor(0, 0, 0);
  for(let i = 0; i < 95; ){
    if(bits[i] !== "1"){ i++; continue; }
    let j = i; while(j < 95 && bits[j] === "1") j++;
    const guard = i < 3 || (i >= 45 && i < 50) || i >= 92;
    doc.rect(ox + (x0 + i * m) * dot, oy + top * dot, ((j - i) * m - red) * dot, (guard ? hg : h) * dot, "F");
    i = j;
  }
  doc.setFont("courier", "bold"); doc.setFontSize(5.4); doc.setTextColor(0, 0, 0);
  const X0 = ox + x0 * dot, M = m * dot, yT = oy + (top + h) * dot + 1.75;
  doc.text(ean[0], X0 - 0.4, yT, { align:"right" });
  doc.text(ean.slice(1, 7), X0 + 24 * M, yT, { align:"center", charSpace:0.35 });
  doc.text(ean.slice(7), X0 + 71 * M, yT, { align:"center", charSpace:0.35 });
}
async function etiquetasPDF(btn, teste){
  const eans = A.etqSel || []; if(!eans.length) return;
  const v = id => $(id) ? $(id).value : null, base = ETQ();
  const cfg = { fmt: v("#etqFmt") || base.fmt, dpi: +(v("#etqDpi") || base.dpi), red: +(v("#etqRed") ?? base.red) };
  store.set("cp-etq", cfg);
  const txt = btn.innerHTML; btn.disabled = true; btn.textContent = "Gerando PDF…";
  try{
    const jsPDF = await carregaJsPDF();
    const lista = teste ? [0, 1, 2].map(red => [eans[0], { ...cfg, red }]) : eans.map(e => [e, cfg]);
    let doc;
    if(cfg.fmt === "a4"){
      // impressora comum: grade de 600 dpi; linhas de corte bem claras entre as etiquetas
      doc = new jsPDF({ unit:"mm", format:"a4", orientation:"portrait" });
      const porFolha = A4.cols * A4.rows;
      lista.forEach(([ean, c], k) => {
        const n = k % porFolha; if(k && !n) doc.addPage("a4", "portrait");
        const col = n % A4.cols, lin = Math.floor(n / A4.cols);
        const x = A4.x0 + col * (A4.w + A4.gx), y = A4.y0 + lin * (A4.h + A4.gy);
        doc.setDrawColor(215, 215, 215); doc.setLineWidth(0.1); doc.rect(x, y, A4.w, A4.h, "S");
        desenhaEtiqueta(doc, ean, { ...c, dpi:600 }, x, y);
        if(teste){ doc.setFont("helvetica", "bold"); doc.setFontSize(4); doc.text(String(c.red), x + 29.3, y + 9.4, { align:"right" }); }
      });
    } else {
      doc = new jsPDF({ unit:"mm", format:[30, 10], orientation:"landscape" });
      lista.forEach(([ean, c], k) => {
        if(k) doc.addPage([30, 10], "landscape");
        desenhaEtiqueta(doc, ean, c);
        if(teste){ doc.setFont("helvetica", "bold"); doc.setFontSize(4); doc.text(String(c.red), 29.3, 9.4, { align:"right" }); }
      });
    }
    const nome = teste ? `teste-espessura-${cfg.fmt === "a4" ? "a4" : cfg.dpi + "dpi"}.pdf` : `etiquetas-ean-${eans.length}${cfg.fmt === "a4" ? "-a4" : ""}.pdf`;
    await salvarArquivo(nome, doc.output("blob"));
  }catch(x){ if(!/cancel|declin|abort/i.test(String(x && (x.code || x.message)))) toast(x.message || "Não foi possível gerar o PDF."); }
  finally{ if(document.body.contains(btn)){ btn.disabled = false; btn.innerHTML = txt; } }
}

async function copy(text){ try{ await navigator.clipboard.writeText(text); return true; }catch(e){ return false; } }

document.addEventListener("click", async e => {
  const el = e.target.closest("[data-act]"); if(!el) return;
  const act = el.dataset.act;
  if(act === "close-ov"){ if(e.target === el) closeModal(); return; }
  switch(act){
    case "logout": api.logout(); V.screen = "scanner"; S.asVendedor = false; render(); break;
    case "to-admin": S.asVendedor = false; render(); break;
    case "to-vendedor": S.asVendedor = true; V.screen = "scanner"; render(); window.scrollTo(0,0); break;
    case "camera": if(!CAM.stream){ CAM.erro = ""; ligarCamera(); } break;
    case "cam-foto": $("#camFile").click(); break;
    case "cam-luz": luzCamera(); break;
    case "abrir": { const v = await api.variacao(el.dataset.id); if(v) abrirVar(v); break; }
    case "sug": { V.q = ""; V.sugs = []; const v = await api.variacao(el.dataset.id); if(v) abrirVar(v); break; }
    case "voltar": V.screen = "scanner"; V.nf = null; renderVendedor(); window.scrollTo(0,0); break;
    case "filtro": V.filtro = el.dataset.f; renderProduto(); break;
    case "sort": { const k = el.dataset.k; V.sort = V.sort.k === k ? { k, dir: -V.sort.dir } : { k, dir:1 }; renderProduto(); break; }
    case "var": { const v = V.list.find(x => x.id === el.dataset.id); if(v){ V.cur = v; V.slide = 0; renderProduto(); window.scrollTo({ top:0, behavior:"smooth" }); } break; }
    case "prev": setSlide(V.slide - 1); break;
    case "next": setSlide(V.slide + 1); break;
    case "slide": setSlide(+el.dataset.i); break;
    case "tab": S.adminTab = el.dataset.t; store.set("cp-admin-tab", S.adminTab); A.testMsg = null; await renderAdmin(); atualizaAdmin(); break;
    case "sync": A.syncing = true; renderAdmin(); { const r = await api.sincronizar(); A.syncing = false; toast(r.ok ? "Sincronizado · " + r.itens + " variações" : "Sincronização com erro: " + r.res); renderAdmin(); } break;
    case "opt": { const k = el.dataset.k, c = api.config(); await api.salvarConfig({ [k]: !c[k] }); renderAdmin(); break; }
    case "copy-wh": A.copied = await copy(api.config().webhook); if(!A.copied) toast("Não foi possível copiar aqui. Selecione o texto."); renderAdmin(); setTimeout(() => { A.copied = false; }, 2000); break;
    case "pfiltro": A.filtro = el.dataset.f; (A.pg ||= {}).prod = 1; renderAdmin(); break;
    case "apg": (A.pg ||= {})[el.dataset.k] = (A.pg[el.dataset.k] || 1) + +el.dataset.d; await renderAdmin(); { const b = document.querySelector(`.apag [data-k="${el.dataset.k}"]`); if(b) b.closest(".apag").scrollIntoView({ block:"nearest" }); } break;
    case "sel": if(A.sel[el.dataset.id]) delete A.sel[el.dataset.id]; else A.sel[el.dataset.id] = true; renderAdmin(); break;
    case "selall": { const prods = await api.produtos(); const all = prods.filter(v => v.ean); if(Object.keys(A.sel).length >= all.length) A.sel = {}; else all.forEach(v => A.sel[v.id] = true); renderAdmin(); break; }
    case "ean-edit": A.editId = el.dataset.id; await renderAdmin(); { const i = document.querySelector("[data-ean-form] input"); if(i){ i.focus(); i.select(); } } break;
    case "ean-cancel": A.editId = null; renderAdmin(); break;
    case "modelo": await api.produtos(); modalModelo(el.dataset.id); break;
    case "modelos-ean": modalModelos(); break;
    case "modelos-gerar": { el.disabled = true; el.textContent = "Gerando…"; try{ const n = await api.gerarEansModelos(); await modalModelos(($("#modBusca") || {}).value || "", n + " EAN" + (n > 1 ? "s" : "") + " de modelo criado" + (n > 1 ? "s" : "")); }catch(x){ toast(x.message); el.disabled = false; } break; }
    case "modelos-etq": { const it = (A.modVis || []).map(x => ({ sku:"Modelo " + x.modelo, ean:x.ean })); modalEtiquetas(it, "Etiquetas de modelo"); break; }
    case "etiquetas": modalEtiquetas(); break;
    case "etq-pdf": etiquetasPDF(el); break;
    case "etq-teste": etiquetasPDF(el, true); break;
    case "copy-eans": toast(await copy(el.dataset.list) ? "Lista copiada" : "Não foi possível copiar aqui"); break;
    case "vincular": modalVincular(el.dataset.ean); break;
    case "novo-vend": modalNovoVend(); break;
    case "u-pin": modalPin(el.dataset.id); break;
    case "u-active": { const u = api.usuarios().find(x => x.id === el.dataset.id); const k = "active"; await api.salvarUsuario(u.id, { [k]: !u[k] }); renderAdmin(); break; }
    case "close": closeModal(); break;
  }
});

<script>
/* =====================================================================
   Pré-pedido — o vendedor monta no showroom e lança no ERP pelo computador
   ===================================================================== */
const PST = { aberto:["Em montagem","tag-acc"], finalizado:["Pronto para lançar","tag-ok"], lancado:["Lançado no ERP","tag-off"], cancelado:["Cancelado","tag-warn"] };
const preKey = () => "cp-pre-ativo-" + S.me.id;
const totalPre = p => p.itens.reduce((a, i) => a + i.qtd * i.preco, 0);
const qtdPre = p => p.itens.reduce((a, i) => a + i.qtd, 0);
const tagPre = p => `<span class="tag ${PST[p.status][1]}">${PST[p.status][0]}</span>`;
function ativo(){ const id = store.get(preKey(), null); const p = id && api.prepedido(id); return p && p.status === "aberto" ? p : null; }
function nAbertos(){ return api.prepedidos().filter(p => p.user === S.me.id && (p.status === "aberto" || p.status === "finalizado")).length; }
function activeStrip(){
  const p = ativo(); if(!p) return "";
  return `<button class="strip" data-act="pre-open" data-id="${esc(p.id)}">
    <span style="flex:1;min-width:0"><b>Montando ${esc(p.num)} · ${esc(p.cliente)}</b><small>${p.itens.length} ${p.itens.length === 1 ? "item" : "itens"} · ${qtdPre(p)} peças${p.ambientes.length ? " · " + p.ambientes.length + (p.ambientes.length === 1 ? " ambiente" : " ambientes") : ""} · ${brl(totalPre(p))}</small></span>
    <span style="font-size:13px;font-weight:700;white-space:nowrap">Ver lista ›</span></button>`;
}

/* ---------- lista de pré-pedidos do vendedor ---------- */
const PERIODOS = [["","Todos"],["hoje","Hoje"],["d3","Últimos 3 dias"],["d7","7 dias"],["d14","14 dias"],["d30","30 dias"],["mes","Este mês"],["custom","Personalizado"]];
const diaIni = d => { const x = new Date(d); x.setHours(0, 0, 0, 0); return x; };
const diaFim = d => { const x = new Date(d); x.setHours(23, 59, 59, 999); return x; };
const ddmm = d => new Date(d).toLocaleDateString("pt-BR", { day:"2-digit", month:"2-digit" });
function periodo(p){
  if(!p || !p.k) return null;
  const hoje = diaIni(Date.now()), fimHoje = diaFim(Date.now()).getTime();
  const volta = n => { const x = new Date(hoje); x.setDate(x.getDate() - (n - 1)); return x.getTime(); };
  if(p.k === "hoje") return { ini:hoje.getTime(), fim:fimHoje, label:"Hoje" };
  if(p.k === "d3") return { ini:volta(3), fim:fimHoje, label:"Últimos 3 dias" };
  if(p.k === "d7") return { ini:volta(7), fim:fimHoje, label:"Últimos 7 dias" };
  if(p.k === "d14") return { ini:volta(14), fim:fimHoje, label:"Últimos 14 dias" };
  if(p.k === "d30") return { ini:volta(30), fim:fimHoje, label:"Últimos 30 dias" };
  if(p.k === "mes") return { ini:new Date(hoje.getFullYear(), hoje.getMonth(), 1).getTime(), fim:fimHoje, label:"Este mês" };
  if(p.k === "custom") return { ini:diaIni(p.ini).getTime(), fim:diaFim(p.fim).getTime(), label: p.ini === p.fim ? new Date(p.ini).toLocaleDateString("pt-BR") : ddmm(p.ini) + " a " + ddmm(p.fim) };
  return null;
}
const CAL = { mes:null, ini:null, fim:null };
function abrirCal(){
  const c = V.per?.k === "custom" ? V.per : null;
  CAL.ini = c ? c.ini : null; CAL.fim = c ? c.fim : null;
  const base = new Date(CAL.ini || Date.now()); CAL.mes = new Date(base.getFullYear(), base.getMonth(), 1);
  renderCal();
}
function renderCal(){
  const m = CAL.mes, ano = m.getFullYear(), mes = m.getMonth();
  const nDias = new Date(ano, mes + 1, 0).getDate(), pul = m.getDay();
  const hj = diaIni(Date.now()).getTime();
  const ini = CAL.ini, fim = CAL.fim || CAL.ini;
  let cells = "";
  for(let i = 0; i < pul; i++) cells += `<button class="out" tabindex="-1" aria-hidden="true"></button>`;
  for(let d = 1; d <= nDias; d++){
    const t = new Date(ano, mes, d).getTime();
    const cls = [t === hj ? "hj" : "", ini && (t === ini || t === fim) ? "sel" : "", ini && t > ini && t < fim ? "mid" : ""].join(" ").trim();
    cells += `<button class="${cls}" data-act="cal-dia" data-t="${t}" aria-label="${new Date(t).toLocaleDateString("pt-BR", { day:"numeric", month:"long" })}" aria-pressed="${!!(ini && t >= ini && t <= fim)}">${d}</button>`;
  }
  const res = !ini ? "Toque no primeiro dia do período" : !CAL.fim ? `De ${ddmm(ini)} · agora toque no último dia` : `De ${ddmm(ini)} até ${ddmm(CAL.fim)}`;
  modal(`<h2>Escolher período</h2>
    <div class="cal">
      <div class="cal-h"><button class="icon-btn" data-act="cal-mes" data-d="-1" aria-label="Mês anterior">${ICON.prev}</button>
        <b>${(t => t[0].toUpperCase() + t.slice(1))(m.toLocaleDateString("pt-BR", { month:"long", year:"numeric" }))}</b>
        <button class="icon-btn" data-act="cal-mes" data-d="1" aria-label="Próximo mês">${ICON.next}</button></div>
      <div class="cal-g">${["D","S","T","Q","Q","S","S"].map(w => `<span class="wd">${w}</span>`).join("")}${cells}</div>
      <span class="cal-res" role="status">${res}</span>
    </div>
    <div class="dlg-act"><button class="btn" data-act="close">Cancelar</button><button class="btn btn-dark" data-act="cal-ok" ${ini ? "" : "disabled"}>Aplicar período</button></div>`);
}

function renderPreList(){
  const PG = 10;
  const q = (V.preBusca || "").trim().toLowerCase(), per = periodo(V.per);
  const norm = t => String(t || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
  const hojeIni = new Date(); hojeIni.setHours(0, 0, 0, 0);
  const isoDia = t => { const d = new Date(t); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
  let all = api.prepedidos().filter(p => (p.user === S.me.id || S.me.role === "admin") && (p.status === "aberto" || p.status === "finalizado"))
    .sort((a, b) => b.createdAt - a.createdAt);
  if(per) all = all.filter(p => p.createdAt >= per.ini && p.createdAt <= per.fim);
  let achou = {};
  if(q){
    const nq = norm(q);
    all = all.filter(p => {
      const dt = new Date(p.createdAt).toLocaleDateString("pt-BR");
      if(norm(p.cliente).includes(nq) || norm(p.num).includes(nq) || dt.includes(q) || dt.slice(0, 5).includes(q) || p.ambientes.some(a => norm(a).includes(nq))) return true;
      const it = p.itens.filter(i => norm(tituloItem(i) + " " + i.sku + " " + i.ean).includes(nq));
      if(it.length){ achou[p.id] = it; return true; }
      return false;
    });
  }
  const hoje = all.filter(p => p.createdAt >= hojeIni.getTime()), antigos = all.filter(p => p.createdAt < hojeIni.getTime());
  const pages = l => Math.max(1, Math.ceil(l.length / PG));
  V.pgHoje = Math.min(V.pgHoje || 1, pages(hoje)); V.pgAnt = Math.min(V.pgAnt || 1, pages(antigos));
  const hl = t => { if(!q) return esc(t); const i = norm(t).indexOf(norm(q)); return i < 0 ? esc(t) : esc(t.slice(0, i)) + "<mark>" + esc(t.slice(i, i + q.length)) + "</mark>" + esc(t.slice(i + q.length)); };
  const card = p => `<button class="pcard" data-act="pre-open" data-id="${esc(p.id)}">
      <span class="l1"><b style="font-size:15px">${hl(p.cliente)}</b>${tagPre(p)}</span>
      <span class="l1"><span class="muted">${quando(p.createdAt)}${S.me.role === "admin" ? " · " + esc(p.vendedor) : ""}</span><b>${brl(totalPre(p))}</b></span>
      <span class="muted">${p.itens.length} ${p.itens.length === 1 ? "item" : "itens"} · ${qtdPre(p)} peças${p.ambientes.length ? " · " + p.ambientes.map(hl).join(", ") : ""}</span>
      ${achou[p.id] ? `<span style="font-size:13px;color:var(--ink2)">${achou[p.id].slice(0, 2).map(i => hl(tituloItem(i)) + " · " + i.qtd + " un").join("<br>")}${achou[p.id].length > 2 ? "<br>+ " + (achou[p.id].length - 2) + (achou[p.id].length - 2 === 1 ? " item" : " itens") : ""}</span>` : ""}</button>`;
  const pag = (l, pg, key) => l.length > PG ? `<div class="pag">
      <button class="btn" data-act="pg" data-k="${key}" data-d="-1" ${pg <= 1 ? "disabled" : ""}>‹ Anterior</button>
      <span class="muted">Página ${pg} de ${pages(l)}</span>
      <button class="btn" data-act="pg" data-k="${key}" data-d="1" ${pg >= pages(l) ? "disabled" : ""}>Próxima ›</button></div>` : "";
  const sec = (t, l, pg, key, vazio) => `<span class="sec">${t} · ${l.length}</span>
    ${l.length ? l.slice((pg - 1) * PG, pg * PG).map(card).join("") : `<div class="vazio">${vazio}</div>`}
    ${pag(l, pg, key)}`;
  $("#app").innerHTML = `<div class="vd vd-wide">
    <div class="ptop">
      <button class="icon-btn" data-act="voltar" aria-label="Voltar ao leitor">${ICON.back}</button>
      <b style="font-family:var(--display);font-size:17px;flex:1">Pré-pedidos</b>
      <button class="btn btn-sm btn-dark" data-act="pre-novo" style="gap:6px;padding:0 14px 0 10px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Novo</button>
    </div>
    <div class="pbody">
      <div class="busca" role="search">
        <input class="inp" id="preBusca" type="search" placeholder="Buscar cliente, produto, SKU ou data" value="${esc(V.preBusca || "")}" aria-label="Buscar pré-pedido por cliente, produto, SKU, ambiente ou data" style="flex:1;min-width:0">
      </div>
      <div class="chips" role="group" aria-label="Período">
        ${PERIODOS.map(([k, l]) => `<button class="pill" data-act="per" data-k="${k}" aria-pressed="${(V.per?.k || "") === k}">${k === "custom" && V.per?.k === "custom" ? esc(per.label) : l}</button>`).join("")}
      </div>
      ${q || per ? `<div class="l1" style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:-6px"><span class="muted">${all.length} ${all.length === 1 ? "pré-pedido encontrado" : "pré-pedidos encontrados"}</span><button class="btn btn-sm" data-act="pre-limpa">Limpar busca</button></div>` : ""}
      ${per ? sec(per.label, all, V.pgAnt, "pgAnt", "Nenhum pré-pedido neste período.")
        : sec("Hoje", hoje, V.pgHoje, "pgHoje", q ? "Nada de hoje com essa busca." : "Nenhum pré-pedido criado hoje.") + sec("Anteriores", antigos, V.pgAnt, "pgAnt", q ? "Nenhum pré-pedido encontrado." : "Nenhum pré-pedido anterior.")}
    </div>
  </div>`;
  const ch = document.querySelector('.chips [aria-pressed="true"]'); if(ch) ch.scrollIntoView({ block:"nearest", inline:"center" });
}

function textoERP(p, mode){
  if(mode === "sku"){ const m = new Map(); p.itens.forEach(i => m.set(i.sku, (m.get(i.sku) || 0) + i.qtd)); return [...m].map(([k, q]) => k + "\t" + q).join("\n"); }
  const head = `Pré-pedido ${p.num} · ${p.cliente} · vendedor ${p.vendedor}${p.obs ? " · " + p.obs : ""}`;
  const rows = grupos(p).flatMap(g => g.itens).map(i => [i.amb || "Sem ambiente", i.sku, i.ean, `${i.nome.replace(" (exemplo)", "")} ${i.cor} ${i.tam}`, i.qtd, i.preco.toFixed(2).replace(".", ","), (i.qtd * i.preco).toFixed(2).replace(".", ",")].join("\t"));
  return [head, ["Ambiente","SKU","EAN","Descrição","Qtd","Unitário","Subtotal"].join("\t"), ...rows, "\t\t\t\tTotal\t\t" + totalPre(p).toFixed(2).replace(".", ",")].join("\n");
}
async function copiarPre(p, mode){
  const txt = textoERP(p, mode);
  if(await copy(txt)) return toast("Copiado. Cole no ERP.");
  modal(`<h2>Copie o texto abaixo</h2><p class="hint">A cópia automática foi bloqueada aqui. Selecione tudo e copie.</p>
    <textarea readonly class="inp mono" style="height:220px;padding:10px;font-size:13px" onfocus="this.select()">${esc(txt)}</textarea>
    <div class="dlg-act"><button class="btn btn-dark" data-act="close">Fechar</button></div>`);
}

function modalNovoPre(depois, err){
  modal(`<h2>Novo pré-pedido</h2>
    ${err ? `<div class="err" role="alert">${esc(err)}</div>` : ""}
    <form id="fPre" style="display:flex;flex-direction:column;gap:14px">

      <div class="fld"><label for="ppO">Observação (opcional)</label><input class="inp" id="ppO" placeholder="Ex.: cozinha, entrega, prazo"></div>
      <div class="dlg-act"><button class="btn" type="button" data-act="close">Cancelar</button><button class="btn btn-dark" type="submit">${depois ? "Criar e adicionar" : "Criar pré-pedido"}</button></div>
    </form>`);
  $("#fPre").onsubmit = async e => { e.preventDefault();
    try{ const p = await api.criarPre({ cliente:$("#ppC").value, telefone:$("#ppT").value, obs:$("#ppO").value });
      store.set(preKey(), p.id); closeModal();
      if(depois) await depois(p); else { V.preId = p.id; V.screen = "preDet"; renderVendedor(); } }
    catch(x){ modalNovoPre(depois, x.message); } };
}

async function adicionar(){
  const q = Math.max(1, parseInt($("#qtd").value, 10) || 1), v = V.cur, cfg = api.config();
  const amb = V.amb || "";
  const go = async p => {
    await api.addItem(p.id, v.id, q, precoDe(v, cfg).valor, amb);
    for(const a of V.ambNovos || []) if(a !== amb) await api.addAmbiente(p.id, a);
    V.ambPre = p.id; V.ambNovos = []; V.qtd = 1; renderProduto();
    toast(`${q} × ${v.cor} ${v.tam}${amb ? " · " + amb : ""} no ${p.num}` + (q > v.total ? ` · atenção: só ${v.total} em estoque` : ""));
  };
  const p = ativo();
  if(p) return go(p);
  const abertos = api.prepedidos().filter(x => x.user === S.me.id && x.status === "aberto");
  if(!abertos.length) return modalNovoPre(go);
  modal(`<h2>Adicionar em qual pré-pedido?</h2>
    <div style="display:flex;flex-direction:column;gap:8px">${abertos.map(x => `<button class="pcard" style="border:1px solid var(--line)" data-act="pre-escolher" data-id="${esc(x.id)}"><span class="l1"><b>${esc(x.cliente)}</b><span class="muted">${esc(x.num)}</span></span><span class="muted">${x.itens.length} itens · ${brl(totalPre(x))}</span></button>`).join("")}</div>
    <div class="dlg-act"><button class="btn" data-act="close">Cancelar</button><button class="btn btn-dark" data-act="pre-escolher-novo">Novo pré-pedido</button></div>`);
  V.pendente = go;
}

/* ---------- ambientes ---------- */
const SUGEST = ["Cozinha","Área gourmet","Banheiro","Lavabo","Closet","Dormitório","Sala","Lavanderia","Escritório"];
function grupos(p, comVazios){
  if(!p.ambientes.length && p.itens.every(i => !i.amb)) return p.itens.length ? [{ a:"", h:false, itens:p.itens }] : [];
  return [...p.ambientes, ""].map(a => ({ a, h:true, itens:p.itens.filter(i => (i.amb || "") === a) })).filter(g => g.itens.length || (comVazios && g.a));
}
function gruposTela(p, ed){
  const g = grupos(p, ed).map(x => ed ? { ...x, h:true } : x);
  if(ed && p.ambientes.length && !g.some(x => x.h && x.a === "")) g.push({ a:"", h:true, itens:[], soDrop:true });
  return g;
}
function modalRenomear(antigo, err){
  const p = api.prepedido(V.preId);
  const outros = p.ambientes.filter(a => a !== antigo);
  const n = p.itens.filter(i => (i.amb || "") === antigo).reduce((x, i) => x + i.qtd, 0);
  const nomeCard = antigo || "Sem ambiente";
  const baloes = outros.map(a => `<button type="button" class="pill" data-act="amb-mvall" data-de="${esc(antigo)}" data-a="${esc(a)}">${esc(a)}</button>`).join("")
    + (antigo ? `<button type="button" class="pill" data-act="amb-mvall" data-de="${esc(antigo)}" data-a="" style="border-style:dashed">Sem ambiente</button>` : "");
  modal(`<h2>${antigo ? "Editar ambiente" : "Dar nome ao ambiente"}</h2>
    ${err ? `<div class="err" role="alert">${esc(err)}</div>` : ""}
    <form id="fRen" style="display:flex;flex-direction:column;gap:14px">
      <div class="fld"><label for="renN">Nome do ambiente</label><input class="inp" id="renN" required maxlength="40" value="${esc(antigo)}" placeholder="Ex.: Cozinha, Suíte master"></div>
      ${antigo ? "" : `<div class="sug">${SUGEST.filter(x => !p.ambientes.includes(x)).map(x => `<button type="button" class="pill" data-act="amb-sug" data-a="${esc(x)}">${esc(x)}</button>`).join("")}</div>
      <p class="hint" style="margin-top:-4px">As peças que estão sem ambiente passam a ficar neste ambiente.</p>`}
      <div class="dlg-act"><button class="btn" type="button" data-act="close">Cancelar</button><button class="btn btn-dark" type="submit">Salvar nome</button></div>
    </form>
    ${n && baloes ? `<div class="mvall">
      <span class="lbl">Ou mover ${n === 1 ? "a peça" : "as " + n + " peças"} de "${esc(nomeCard)}" para</span>
      <div class="sug">${baloes}</div>
      <p class="hint">${antigo ? `O card "${esc(antigo)}" deixa de existir e as` : "As"} peças iguais têm as quantidades somadas.</p>
    </div>` : ""}`);
  const i = $("#renN"); i.focus(); i.select();
  $("#fRen").onsubmit = async e => { e.preventDefault();
    const nome = i.value.trim();
    if(!nome) return modalRenomear(antigo, "Dê um nome ao ambiente.");
    try{ if(antigo) await api.renomearAmbiente(V.preId, antigo, nome); else await api.moverTodos(V.preId, "", nome); }catch(x){ return modalRenomear(antigo, x.message); }
    if(V.amb === antigo) V.amb = nome;
    closeModal(); renderPreDet(); if(nome !== antigo) toast(antigo ? "Ambiente renomeado para " + nome : "Peças agora no ambiente " + nome); };
}
function ambList(){
  const p = ativo();
  if((p ? p.id : null) !== (V.ambPre ?? null)){ V.ambPre = p ? p.id : null; V.amb = ""; V.ambNovos = []; }
  return [...new Set([...(p ? p.ambientes : []), ...(V.ambNovos || [])])];
}
function ambRow(){

/* ---------- eventos ---------- */
document.addEventListener("click", async e => {
  const el = e.target.closest("[data-act]"); if(!el) return;
  const id = el.dataset.id;
  try{
    switch(el.dataset.act){
      case "pre-list": V.screen = "pre"; renderVendedor(); window.scrollTo(0,0); break;
      case "pre-open": carregaSomSerena().catch(() => {}); V.preId = id; V.screen = "preDet"; renderVendedor(); window.scrollTo(0,0); break;
      case "pre-novo": modalNovoPre(); break;
      case "pg": V[el.dataset.k] = (V[el.dataset.k] || 1) + +el.dataset.d; renderPreList(); el.closest(".pbody") && window.scrollTo(0, 0); break;
      case "pre-limpa": V.preBusca = ""; V.per = null; V.pgHoje = V.pgAnt = 1; renderPreList(); break;
      case "per": { const k = el.dataset.k; if(k === "custom"){ abrirCal(); break; } V.per = k ? { k } : null; V.pgHoje = V.pgAnt = 1; renderPreList(); break; }
      case "cal-mes": CAL.mes = new Date(CAL.mes.getFullYear(), CAL.mes.getMonth() + +el.dataset.d, 1); renderCal(); break;
      case "cal-dia": { const t = +el.dataset.t; if(!CAL.ini || CAL.fim) { CAL.ini = t; CAL.fim = null; } else if(t < CAL.ini){ CAL.fim = CAL.ini; CAL.ini = t; } else CAL.fim = t; renderCal(); break; }
      case "cal-ok": V.per = { k:"custom", ini:CAL.ini, fim:CAL.fim || CAL.ini }; V.pgHoje = V.pgAnt = 1; closeModal(); renderPreList(); break;
      case "q-": case "q+": { const i = $("#qtd"); i.value = Math.max(1, (parseInt(i.value, 10) || 1) + (el.dataset.act === "q+" ? 1 : -1)); V.qtd = +i.value; break; }
      case "add-pre": if(V.cur && V.cur.placeholder){ toast("Escolha uma variação na lista primeiro"); break; } await adicionar(); break;
      case "pre-escolher": store.set(preKey(), id); closeModal(); if(V.pendente) await V.pendente(api.prepedido(id)); break;
      case "pre-escolher-novo": modalNovoPre(V.pendente); break;
      case "pq": { const p = api.prepedido(V.preId), it = p.itens.find(i => i.key === el.dataset.k);
        if(+el.dataset.d <= -999999){ await excluirItem(it.key); break; }
        const nq = it.qtd + +el.dataset.d; if(nq <= 0){ await excluirItem(it.key); break; } await api.setQtd(p.id, it.key, nq); renderPreDet(); break; }
      case "amb-pick": guardaQtd(); ambList(); V.amb = el.dataset.a; gavetaAmb(false); setTimeout(() => { if(V.screen === "produto") renderProduto(); }, 300); break;
      case "amb-toggle": gavetaAmb(!V.ambAberto); break;
      case "amb-novo": guardaQtd(); modalAmb(); break;
      case "amb-ren": modalRenomear(el.dataset.a); break;
      case "cli-edit": modalCliente(); break;
      case "pre-pdf": await baixarPDF(api.prepedido(id), el); break;
      case "amb-mvall": { const de = el.dataset.de, para = el.dataset.a;
        await api.moverTodos(V.preId, de, para); if(V.amb === de) V.amb = para;
        closeModal(); renderPreDet(); toast(`Peças de ${de} movidas para ${para || "sem ambiente"}`); break; }
      case "amb-sug": { const f = $("#ambN") || $("#renN"); f.value = el.dataset.a; f.focus(); break; }
      case "pre-continuar": store.set(preKey(), id); V.screen = "scanner"; renderVendedor(); window.scrollTo(0,0); break;
      case "pre-fin": await api.setPre(id, { status:"finalizado" }); tocaSomSerena(); if(store.get(preKey()) === id) store.set(preKey(), null); toast("Pronto para lançar no computador"); renderPreDet(); break;
      case "pre-reabrir": await api.setPre(id, { status:"aberto" }); store.set(preKey(), id); renderPreDet(); break;
      case "pre-cancel": if(!el.dataset.c){ el.dataset.c = "1"; el.textContent = "Confirmar cancelamento"; return; }
        await api.setPre(id, { status:"cancelado" }); if(store.get(preKey()) === id) store.set(preKey(), null); toast("Pré-pedido cancelado"); V.screen = "pre"; renderVendedor(); break;
      case "pre-copy": await copiarPre(api.prepedido(id), el.dataset.mode); break;
      case "apre-f": A.preF = el.dataset.f; (A.pg ||= {}).apre = 1; renderAdmin(); break;
      case "apre-open": modalAdmPre(id); break;
    }
  }catch(x){ toast(x.message); }
});

/* ---------- PDF do pré-pedido (itens e quantidades por ambiente, sem valores) ---------- */
let jsPDFp;
function carregaJsPDF(){
  if(window.jspdf) return Promise.resolve(window.jspdf.jsPDF);
  return jsPDFp ||= new Promise((ok, erro) => {
    const sc = document.createElement("script");
    sc.src = "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js";
    sc.onload = () => ok(window.jspdf.jsPDF);
    sc.onerror = () => { jsPDFp = null; erro(new Error("Não consegui carregar o gerador de PDF. Verifique a internet.")); };
    document.head.appendChild(sc);
  });
}
async function fotoPng(url, px){
  if(!url) return null;
  try{
    const r = await fetch(api.fnUrl + "/magazord?img=" + encodeURIComponent(url)); if(!r.ok) return null;
    const bmp = await createImageBitmap(await r.blob());
    const c = document.createElement("canvas"); c.width = c.height = px; const x = c.getContext("2d");
    x.fillStyle = "#FFFFFF"; x.fillRect(0, 0, px, px);
    const k = Math.min(px / bmp.width, px / bmp.height), w = bmp.width * k, h = bmp.height * k;
    x.drawImage(bmp, (px - w) / 2, (px - h) / 2, w, h);
    return c.toDataURL("image/jpeg", 0.85);
  }catch(e){ return null; }
}
function svgPng(svg, px){
  return new Promise(ok => {
    const s = svg.replace("<svg ", `<svg xmlns="http://www.w3.org/2000/svg" width="${px}" height="${px}" `);
    const im = new Image();
    im.onload = () => { const c = document.createElement("canvas"); c.width = c.height = px; const x = c.getContext("2d");
      x.fillStyle = "#E9E7E2"; x.fillRect(0, 0, px, px); x.drawImage(im, 0, 0, px, px); ok(c.toDataURL("image/png")); };
    im.onerror = () => ok(null);
    im.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(s);
  });
}
let downloadsP;
function pegaDownloads(){
  if(!window.claude || !window.claude.use) return Promise.resolve(null);
  return downloadsP ||= Promise.race([window.claude.use("downloads").catch(() => null), new Promise(r => setTimeout(() => r(null), 4000))]);
}
async function salvarArquivo(filename, blob){
  const dl = await pegaDownloads();
  if(dl){ await dl.save({ filename, data: blob }); return; }
  const url = URL.createObjectURL(blob), a = document.createElement("a");
  a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}
const slugify = t => String(t).normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^A-Za-z0-9]+/g, "-").replace(/^-|-$/g, "").toLowerCase().slice(0, 40);

async function gerarPDF(p){
  const jsPDF = await carregaJsPDF();
  const thumbs = {};
  for(const i of p.itens){ if(thumbs[i.varId] !== undefined) continue; const v = api.variacaoInfo(i.varId); thumbs[i.varId] = await fotoPng(i.foto || (v && v.fotos && v.fotos[0]), 200); }
  const doc = new jsPDF({ unit:"mm", format:"a4" });
  const PW = 210, PH = 297, M = 14, W = PW - 2*M, BOT = PH - 20;
  const INK = [20,63,84], MUT = [91,105,112], ACC = [138,101,38], LINE = [228,222,211], SOFT = [251,240,223], PET = [22,76,100], PETD = [15,58,78], GOLD = [255,209,149];
  const col = c => doc.setTextColor(c[0], c[1], c[2]);
  const font = (st, sz, f) => { doc.setFont(f || "helvetica", st); doc.setFontSize(sz); };
  let y = M;

  // cabeçalho na identidade da Serena: faixa petróleo com o logo
  const cab = () => {
    doc.setFillColor(PETD[0], PETD[1], PETD[2]); doc.rect(0, 0, PW, 30, "F");
    doc.setFillColor(GOLD[0], GOLD[1], GOLD[2]); doc.rect(0, 30, PW, 1.2, "F");
    doc.addImage(LOGO.escuro, "PNG", M, 6, 40, 40 * 322 / 720);
    font("bold", 7.5); col(GOLD); doc.text("L I S T A   D E   P E Ç A S", PW - M, 13.5, { align:"right" });
    font("normal", 9); doc.setTextColor(255, 255, 255); doc.text(new Date().toLocaleDateString("pt-BR"), PW - M, 19.5, { align:"right" });
  };
  cab(); y = 51;
  font("bold", 7.5); col(ACC); doc.text("C L I E N T E", M, y - 10);
  font("bold", 22); col(INK);
  doc.splitTextToSize(p.cliente, W).forEach(l => { doc.text(l, M, y); y += 9; });
  y -= 2;
  font("normal", 10); col(MUT);
  const meta = ["Vendedor: " + p.vendedor, "Criado em " + new Date(p.createdAt).toLocaleDateString("pt-BR")];
  if(p.telefone) meta.push("Tel.: " + p.telefone);
  doc.text(meta.join("   ·   "), M, y); y += 5;
  if(p.obs){ doc.splitTextToSize("Obs.: " + p.obs, W).forEach(l => { doc.text(l, M, y); y += 5; }); }
  y += 4;

  // cards por ambiente
  const gs = grupos(p).map(g => ({ ...g, nome: g.h ? (g.a || "Sem ambiente") : "Peças" }));
  const ROW = 17, HEAD = 11, COLS = { img:M + 4, tit:M + 21, sku:M + 112, ean:M + 140, qtd:M + W - 4 };
  let segIni = 0;
  const fechaSeg = () => { doc.setDrawColor(LINE[0], LINE[1], LINE[2]); doc.setLineWidth(0.35); doc.roundedRect(M, segIni, W, y - segIni, 3, 3, "S"); };
  const cabCard = (g, cont) => {
    segIni = y;
    doc.setFillColor(PET[0], PET[1], PET[2]); doc.roundedRect(M, y, W, HEAD, 3, 3, "F"); doc.rect(M, y + HEAD - 3, W, 3, "F");
    doc.setFillColor(GOLD[0], GOLD[1], GOLD[2]); doc.rect(M, y + HEAD - 0.8, W, 0.8, "F");
    font("bold", 12); doc.setTextColor(255, 255, 255); doc.text(g.nome + (cont ? "  (continuação)" : ""), M + 4, y + 7.3);
    const n = g.itens.reduce((x, i) => x + i.qtd, 0);
    font("normal", 9.5); col(GOLD); doc.text(n + (n === 1 ? " peça" : " peças") + "  ·  " + g.itens.length + (g.itens.length === 1 ? " item" : " itens"), PW - M - 4, y + 7.3, { align:"right" });
    y += HEAD;
    font("bold", 7.5); col(MUT);
    doc.text("PRODUTO", COLS.tit, y + 5); doc.text("SKU", COLS.sku, y + 5); doc.text("EAN", COLS.ean, y + 5); doc.text("QTD", COLS.qtd, y + 5, { align:"right" });
    y += 7; doc.setDrawColor(LINE[0], LINE[1], LINE[2]); doc.setLineWidth(0.25); doc.line(M, y, M + W, y);
  };
  for(const g of gs){
    if(y + HEAD + 7 + ROW + 4 > BOT){ doc.addPage(); cab(); y = 40; }
    cabCard(g, false);
    g.itens.forEach((i, k) => {
      if(y + ROW > BOT){ fechaSeg(); doc.addPage(); cab(); y = 40; cabCard(g, true); }
      const th = thumbs[i.varId];
      if(th) doc.addImage(th, "JPEG", COLS.img, y + 2.5, 12, 12);
      else { doc.setFillColor(233,231,226); doc.roundedRect(COLS.img, y + 2.5, 12, 12, 1.5, 1.5, "F"); }
      font("bold", 10); col(INK);
      const tl = doc.splitTextToSize(tituloItem(i), COLS.sku - COLS.tit - 4).slice(0, 2);
      tl.forEach((l, j) => doc.text(l, COLS.tit, y + (tl.length === 1 ? 10 : 7.2) + j * 4.6));
      font("normal", 8.5, "courier"); col(MUT);
      doc.text(i.sku, COLS.sku, y + 10); doc.text(i.ean || "-", COLS.ean, y + 10);
      font("bold", 13); col(PET); doc.text(String(i.qtd), COLS.qtd, y + 10.6, { align:"right" });
      y += ROW;
      if(k < g.itens.length - 1){ doc.setDrawColor(239,237,233); doc.setLineWidth(0.2); doc.line(M + 4, y, M + W - 4, y); }
    });
    fechaSeg(); y += 6;
  }

  // resumo
  if(y + 16 > BOT){ doc.addPage(); cab(); y = 40; }
  const tot = qtdPre(p), amb = gs.filter(g => g.h).length;
  font("bold", 12); col(INK);
  doc.text(`Total: ${tot} ${tot === 1 ? "peça" : "peças"} em ${p.itens.length} ${p.itens.length === 1 ? "item" : "itens"}${amb ? ` · ${amb} ${amb === 1 ? "ambiente" : "ambientes"}` : ""}`, M, y + 4);

  // rodapé em todas as páginas
  const np = doc.internal.getNumberOfPages();
  for(let k = 1; k <= np; k++){
    doc.setPage(k);
    doc.setDrawColor(GOLD[0], GOLD[1], GOLD[2]); doc.setLineWidth(0.6); doc.line(M, PH - 16, PW - M, PH - 16);
    font("normal", 8); col(MUT);
    doc.text("Documento sem valores. Preços e condições serão enviados na pré-venda pelo vendedor.", M, PH - 11);
    font("bold", 8); col(PET); doc.text("serenapuxadores.com.br", M, PH - 6.5);
    font("normal", 8); col(MUT); doc.text(`${p.num} · página ${k} de ${np}`, PW - M, PH - 6.5, { align:"right" });
  }
  return doc.output("blob");
}
async function baixarPDF(p, btn){
  const txt = btn ? btn.innerHTML : "";
  if(btn){ btn.disabled = true; btn.textContent = "Gerando PDF…"; }
  try{
    const blob = await gerarPDF(p);
    await salvarArquivo(`pre-pedido-${p.num}-${slugify(p.cliente)}.pdf`, blob);
  }catch(x){ if(!/cancel|declin|abort/i.test(String(x && (x.code || x.message)))) toast(x.message || "Não foi possível gerar o PDF."); }
  finally{ if(btn && document.body.contains(btn)){ btn.disabled = false; btn.innerHTML = txt; } }
}

/* ---------- editar cliente ---------- */
function modalCliente(err){
  const p = api.prepedido(V.preId);
  modal(`<h2>Editar cliente</h2>
    ${err ? `<div class="err" role="alert">${esc(err)}</div>` : ""}
    <form id="fCli" style="display:flex;flex-direction:column;gap:14px">
      <div class="fld"><label for="cliN">Cliente</label><input class="inp" id="cliN" required maxlength="80" value="${esc(p.cliente)}"></div>
      <div class="fld"><label for="cliT">Telefone (opcional)</label><input class="inp" id="cliT" inputmode="tel" value="${esc(p.telefone)}"></div>
      <div class="fld"><label for="cliO">Observação (opcional)</label><input class="inp" id="cliO" value="${esc(p.obs)}"></div>
      <div class="dlg-act"><button class="btn" type="button" data-act="close">Cancelar</button><button class="btn btn-dark" type="submit">Salvar</button></div>
    </form>`);
  const n = $("#cliN"); n.focus(); n.select();
  $("#fCli").onsubmit = async e => { e.preventDefault();
    const cliente = n.value.trim(); if(!cliente) return modalCliente("Informe o nome do cliente.");
    try{ await api.setPre(p.id, { cliente, telefone:$("#cliT").value.trim(), obs:$("#cliO").value.trim() }); }catch(x){ return modalCliente(x.message); }
    closeModal(); renderPreDet(); toast("Cliente atualizado"); };
}
