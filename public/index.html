let somSerena = null;
async function carregaSomSerena(){
  if(somSerena) return somSerena;
  liberaAudio(); if(!audioCtx) return null;
  const bin = atob(SOM_SERENA_B64), buf = new Uint8Array(bin.length);
  for(let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
  somSerena = await new Promise((ok, erro) => audioCtx.decodeAudioData(buf.buffer, ok, erro));
  return somSerena;
}
async function tocaSomSerena(){
  try{
    const b = await carregaSomSerena(); if(!b) return;
    if(audioCtx.state === "suspended") await audioCtx.resume();
    const src = audioCtx.createBufferSource(); src.buffer = b; src.connect(audioCtx.destination); src.start();
  }catch(e){}
}

/* ---------- excluir peça (com desfazer) ---------- */
function toastUndo(msg, fn){
  const t = $("#toast");
  t.innerHTML = `<span>${esc(msg)}</span><button class="undo">Desfazer</button>`;
  t.hidden = false;
  t.querySelector(".undo").onclick = async () => { t.hidden = true; try{ await fn(); }catch(x){ toast(x.message); } };
  clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 5000);
}
async function excluirItem(key){
  const p = api.prepedido(V.preId), it = p.itens.find(i => i.key === key); if(!it) return;
  await api.setQtd(p.id, key, 0); renderPreDet();
  toastUndo(`${tituloItem(it)} excluído`, async () => { await api.addItem(p.id, it.varId, it.qtd, it.preco, it.amb); renderPreDet(); });
}

/* ---------- deslizar para a esquerda ---------- */
const SW = { el:null, on:false };
function swReset(anim){
  if(!SW.el) return;
  const el = SW.el, bg = el.previousElementSibling;
  if(anim){ el.classList.add("snap"); el.style.transform = ""; setTimeout(() => el.classList.remove("snap"), 240); } else el.style.transform = "";
  if(bg) bg.style.opacity = 0;
  SW.el = null; SW.on = false;
}

/* ---------- arrastar peça entre ambientes ---------- */
const DR = { t:null, on:false, el:null };
function dragAlvo(x, y){
  const c = document.elementFromPoint(x, y)?.closest("[data-drop]") || null;
  document.querySelectorAll(".card.drop-on").forEach(k => { if(k !== c) k.classList.remove("drop-on"); });
  if(c) c.classList.add("drop-on");
  DR.alvo = c;
}
function dragMove(x, y){
  DR.x = x; DR.y = y;
  DR.g.style.left = (x - DR.dx) + "px"; DR.g.style.top = (y - DR.dy) + "px";
  dragAlvo(x, y);
}
function dragStart(){
  const it = DR.el; if(!it || !document.body.contains(it)) return;
  DR.on = true;
  const r = it.getBoundingClientRect();
  DR.dx = DR.sx - r.left; DR.dy = DR.sy - r.top;
  const g = document.createElement("div"); g.className = "ghost card"; g.style.width = r.width + "px";
  g.appendChild(it.cloneNode(true)); document.body.appendChild(g); DR.g = g;
  it.classList.add("lifting"); document.body.classList.add("dragging");
  try{ navigator.vibrate && navigator.vibrate(12); }catch(e){}
  dragMove(DR.sx, DR.sy);
  DR.scroll = setInterval(() => {
    const m = 90, v = DR.y < m ? -14 : DR.y > innerHeight - m ? 14 : 0;
    if(v){ window.scrollBy(0, v); dragAlvo(DR.x, DR.y); }
  }, 16);
}
function dragEnd(){
  clearTimeout(DR.t); clearInterval(DR.scroll);
  if(DR.g) DR.g.remove();
  document.querySelectorAll(".drop-on").forEach(k => k.classList.remove("drop-on"));
  document.querySelectorAll(".lifting").forEach(k => k.classList.remove("lifting"));
  document.body.classList.remove("dragging");
  DR.on = false; DR.el = null; DR.g = null; DR.alvo = null;
}
document.addEventListener("pointerdown", e => {
  const it = e.target.closest(".it[data-k]");
  if(!it || e.target.closest("button,input,select,a") || (e.pointerType === "mouse" && e.button !== 0)) return;
  SW.el = it; SW.on = false; SW.sx = e.clientX; SW.sy = e.clientY;
  DR.sx = e.clientX; DR.sy = e.clientY;
  clearTimeout(DR.t);
  if(it.dataset.drag){ DR.el = it; DR.t = setTimeout(() => { if(!SW.on){ SW.el = null; dragStart(); } }, e.pointerType === "mouse" ? 220 : 400); }
});
document.addEventListener("pointermove", e => {
  if(DR.on){ e.preventDefault(); dragMove(e.clientX, e.clientY); return; }
  if(SW.el){
    const dx = e.clientX - SW.sx, dy = e.clientY - SW.sy;
    if(!SW.on){
      if(dx < -10 && Math.abs(dx) > Math.abs(dy) * 1.3){ SW.on = true; clearTimeout(DR.t); DR.el = null; }
      else if(Math.hypot(dx, dy) > 10){ clearTimeout(DR.t); DR.el = null; SW.el = null; return; }
    }
    if(SW.on){
      const w = SW.el.offsetWidth, x = Math.min(0, dx);
      SW.el.style.transform = `translateX(${x}px)`;
      const bg = SW.el.previousElementSibling; if(bg) bg.style.opacity = Math.min(1, -x / (w * 0.3));
    }
  }
});
document.addEventListener("pointerup", async e => {
  if(SW.on && SW.el){
    const el = SW.el, w = el.offsetWidth, dx = e.clientX - SW.sx;
    if(dx < -Math.min(140, w * 0.35)){
      const key = el.dataset.k; SW.el = null; SW.on = false;
      el.classList.add("snap"); el.style.transform = `translateX(${-w - 20}px)`;
      setTimeout(() => excluirItem(key), 200);
    } else swReset(true);
    return;
  }
  SW.el = null;
  if(!DR.on){ clearTimeout(DR.t); DR.el = null; return; }
  const key = DR.el.dataset.drag, de = DR.el.dataset.amb, alvo = DR.alvo;
  dragEnd();
  if(!alvo) return;
  const para = alvo.dataset.drop;
  if(para === de) return;
  try{ await api.moverItem(V.preId, key, para); renderPreDet(); toast("Movido para " + (para || "sem ambiente")); }
  catch(x){ toast(x.message); }
});
document.addEventListener("pointercancel", () => { swReset(true); if(DR.on) dragEnd(); else { clearTimeout(DR.t); DR.el = null; } });
document.addEventListener("touchmove", e => { if(DR.on) e.preventDefault(); }, { passive:false });
document.addEventListener("contextmenu", e => { if(e.target.closest(".it[data-drag]")) e.preventDefault(); });
document.addEventListener("keydown", e => { if(e.key === "Escape" && DR.on) dragEnd(); });

window.addEventListener("cp-pre-mudou", ev => {
  if($("#modal").innerHTML || (typeof DR !== "undefined" && DR.on)) return;
  if(S.me && S.me.role === "admin" && !S.asVendedor && S.adminTab === "pre") return renderAdmin();
  if(V.screen === "pre") return renderPreList();
  if(V.screen === "preDet" && ev.detail === V.preId && !document.activeElement?.matches("input")) return renderPreDet();
});

/* ---------- início ---------- */
try{ history.scrollRestoration = "manual"; }catch(e){}
window.scrollTo(0, 0);
// se algo der errado ao desenhar a tela, mostra o motivo em vez de deixar a página em branco
window.addEventListener("error", e => { try{ toast("Erro na tela: " + (e.message || e.error)); }catch(x){} });
window.addEventListener("unhandledrejection", e => { try{ toast("Erro: " + ((e.reason && e.reason.message) || e.reason)); }catch(x){} });
$("#app").innerHTML = `<div class="lg"><img src="${LOGO.escuro}" alt="Serena Puxadores" style="width:200px;opacity:.9"></div>`;
api.init().then(async () => {
  if(!api.me()){ try{ S.semAdmin = !(await api.temAdmin()); }catch(e){ S.semAdmin = false; } }
  render();
}).catch(() => render());
</script>
</body>
